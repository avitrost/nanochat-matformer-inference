[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nanochat-matformer-inference"
version = "0.1.0"
description = "Minimal inference for the nanochat fixed-attention MatFormer checkpoint"
requires-python = ">=3.10"
dependencies = ["torch>=2.6", "huggingface-hub>=0.27", "tiktoken>=0.8"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
matformer = "matformer.__main__:main"

[tool.setuptools.packages.find]
include = ["matformer*"]
